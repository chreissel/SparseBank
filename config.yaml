# ──────────────────────────────────────────────────
# GW Analysis Pipeline – Configuration
# ──────────────────────────────────────────────────

# ── Global ────────────────────────────────────────
seed: 42

# ── Step 1: Data generation  ──────────────────────     
sample_rate: 512     # Hz
duration: 64         # seconds per sample
f_min: 20.0          # Hz
f_max: 256.0
f_ref: 50.0
snr_min: 20.0
snr_max: 30.0
m1_min: 1.0          # solar masses
m1_max: 2.5
n_train: 10000
n_val:   1000
n_test:  1000
batch_size: 350
open_data: /n/holystore01/LABS/iaifi_lab/Lab/creissel/SparseBank/background_data # root directory for HDF5 files
data_dir: /n/holystore01/LABS/iaifi_lab/Lab/creissel/SparseBank/sim # root directory for HDF5 files

# ── Step 2: Training mass regression ────────────────
data:
  data_dir: /n/holystore01/LABS/iaifi_lab/Lab/creissel/SparseBank/sim/
  batch_size: 32
  num_workers: 4
  # Variables to regress. Any subset of the keys stored in the HDF5 files:
  #   chirp_mass, mass_ratio, snr, chi1, chi2, distance, inclination,
  #   dec, psi, phi, phic, mass_1, mass_2, s1z, s2z
  target_variables: [chirp_mass, mass_ratio]

model:
  d_input:  2    # number of input channels (strain only)
  d_output: 2    # number of regression targets (must match len(target_variables))
  d_model:  64
  d_state:  16
  n_layers: 4
  dropout:  0.1
  # Loss function: "mse" (MSELoss) or "gaussian_nll" (GaussianNLLLoss with
  # predicted uncertainties). With gaussian_nll the model outputs mean + log-var
  # for each target variable (2 * d_output outputs total).
  loss: gaussian_nll

training:
  max_epochs: 2
  checkpoint_dir: /n/holystore01/LABS/iaifi_lab/Lab/creissel/SparseBank/model/

# ── Step 3: Bank filtering ────────────────────────
bank_filter:
  # Path to the full gstlal template bank (XML or XML.gz)
  input_bank:  ./bns.xml
  # Output filtered bank
  output_bank: templates/filtered_banks/
  # Extra margin around predicted chirp-mass range (M_sun)
  margin: 0.1

# ── Step 4: Matched filtering ───────────
matched_filter:
  ifos: [H1, L1]
  # Pre-whitened HDF5 test data produced by step 1.
  # Defaults to {data_dir}/test when omitted.
  test_dir: /n/holystore01/LABS/iaifi_lab/Lab/creissel/SparseBank/sim/test
  output_dir: gstlal_output

# ── Step 5: Sensitive volume ──────────────────────────────────
sensitive_volume:
  # Output directory for V_T results and downloaded catalog data
  output_dir: sensitive_volume_output
  # SNR threshold used as a proxy for FAR = 1/year.
  # For a 2-detector H1+L1 network at O3 sensitivity, combined network SNR
  # ≈ 10–12 corresponds to a false alarm rate of roughly 1/year.
  snr_threshold: 10.0
  # Reference calibration: a canonical 1.4+1.4 M_sun BNS at this luminosity
  # distance achieves snr_ref in a single O3-like detector.
  d_ref_mpc: 100.0
  snr_ref:   8.0    # minimum injection SNR (= Step 1 snr_min)
  # FAR threshold in Hz (1/year = 3.17e-8 Hz)
  far_threshold_hz: 3.17e-8
  # GWOSC catalogs to download for comparison
  gwosc_catalogs: [GWTC-2, GWTC-3]
  # BNS / NSBH events to fetch individually (in addition to mass-range matches)
  bns_events:
    - GW170817
    - GW190425
    - GW200105_162426
    - GW200115_042309
